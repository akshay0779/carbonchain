<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CarbonChain – Carbon Credit Ledger</title>
<style>
:root{--bg:#eef2ea;--card:#fbfcf8;--tx:#1b2a1f;--mu:#60705f;--ac:#2f7d4f;--ac2:#b9852b;--bd:#d5dccd;--bad:#b83a2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1812;--card:#17231b;--tx:#e4eddf;--mu:#8fa38d;--ac:#5fc088;--ac2:#e0b04f;--bd:#27382c;--bad:#ef7b6c}}
:root[data-theme=dark]{--bg:#0f1812;--card:#17231b;--tx:#e4eddf;--mu:#8fa38d;--ac:#5fc088;--ac2:#e0b04f;--bd:#27382c;--bad:#ef7b6c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Georgia,'Times New Roman',serif}
h1,h2,h3,nav button,th,.k{font-family:'Trebuchet MS',Verdana,sans-serif}
.app{display:flex;min-height:100vh}
nav{width:200px;flex:none;padding:16px 10px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:19px;margin:0 6px 14px;color:var(--ac)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mu);padding:8px 10px;border-radius:6px;font-size:14px;cursor:pointer}
nav button.on{background:var(--ac);color:var(--bg);font-weight:700}
main{flex:1;min-width:0;padding:18px 22px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
h2{margin:0;font-size:24px}h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g .card{margin:0}
.big{font:700 26px 'Trebuchet MS',sans-serif;color:var(--ac)}.mu{color:var(--mu);font-size:13px}
button.b,select,input{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:6px 10px}
button.b{background:var(--ac);color:var(--bg);border-color:var(--ac);cursor:pointer;font-weight:700}
button.b.alt{background:none;color:var(--ac)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mu)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
.hs{font-family:Consolas,monospace;font-size:12px;word-break:break-all;color:var(--mu)}
pre{margin:0;font:12px/1.5 Consolas,monospace;overflow-x:auto;white-space:pre}
.ok{color:var(--ac)}.no{color:var(--bad)}
.cert{border:2px double var(--ac2);padding:16px;border-radius:6px;margin-bottom:12px;background:var(--card)}
.cert h3{color:var(--ac2);font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
svg{width:100%;height:auto;display:block}
@media(max-width:700px){.app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:8px}nav h1{display:none}nav button{width:auto;white-space:nowrap}main{padding:14px}}
@media print{:root{--bg:#fff!important;--card:#fff!important;--tx:#111!important;--mu:#444!important;--ac:#1f5d38!important;--ac2:#7a5410!important;--bd:#999!important}body *{visibility:hidden}.cert.pp,.cert.pp *{visibility:visible}.cert.pp{position:absolute;left:0;top:0;width:100%}.no-print{display:none}}
#tour,#dlg{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;max-width:360px;width:calc(100% - 32px)}
#dlg{left:50%;right:auto;top:10%;bottom:auto;transform:translateX(-50%);max-width:520px}
.dlg{background:var(--card);border:2px solid var(--ac);border-radius:10px;padding:14px;box-shadow:0 6px 24px #0004}.dlg p{margin:6px 0 10px}
.dlg textarea{width:100%;font:11px Consolas,monospace;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px}
button:disabled{opacity:.4;cursor:default}
@keyframes pop{0%{transform:scale(.5);opacity:0;box-shadow:0 0 0 0 var(--ac)}60%{transform:scale(1.15);box-shadow:0 0 0 10px transparent}100%{transform:scale(1);opacity:1}}.pop{animation:pop .6s ease-out}
</style></head><body><div class="app"><nav id="nav"></nav><main><div class="top"><h2 id="ttl"></h2><div class="row"><label>Acting as<select id="me" onchange="ME=+this.value;render()"></select></label><button class="b alt" onclick="theme()">Light / Dark</button><button class="b alt" onclick="openIO()">Save / Load</button><button class="b alt" onclick="tour(0)">Tour</button><button class="b alt" onclick="SND=!SND;this.textContent=SND?'Sound on':'Sound off'">Sound on</button><button class="b alt" onclick="if(confirm('Reset the chain and all wallets?'))reset()">Reset chain</button></div></div><div id="news"></div><div id="main"></div></main></div><div id="tour"></div><div id="dlg"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),sh=a=>a.slice(0,8)+'…'+a.slice(-4),R=(n=40)=>[...Array(n)].map(()=>'0123456789abcdef'[Math.random()*16|0]).join(''),f2=n=>n.toFixed(2);
const K=[],H0=[];(()=>{let n=0;for(let i=2;n<64;i++){let p=1;for(let j=2;j*j<=i;j++)if(i%j<1){p=0;break}if(p){if(n<8)H0[n]=Math.sqrt(i)%1*4294967296|0;K[n++]=Math.cbrt(i)%1*4294967296|0}}})();
const rr=(x,n)=>(x>>>n)|(x<<(32-n));
function hash(s){const m=[...new TextEncoder().encode(s)],l=m.length*8;m.push(128);while(m.length%64!=56)m.push(0);for(let i=7;i>=0;i--)m.push(i>3?0:(l>>>(i*8))&255);let h=H0.slice();const w=[];for(let o=0;o<m.length;o+=64){for(let i=0;i<16;i++)w[i]=m[o+i*4]<<24|m[o+i*4+1]<<16|m[o+i*4+2]<<8|m[o+i*4+3];for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(b,17)^rr(b,19)^(b>>>10)))|0}let[a,b,c,d,e,f,g,j]=h;for(let i=0;i<64;i++){const t1=(j+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;j=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}h=[h[0]+a,h[1]+b,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+j].map(x=>x|0)}return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
function save(){try{localStorage.setItem('cc1',JSON.stringify({chain,W,S,price,ME}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('cc1'));if(!d||!d.chain.length)return 0;chain.push(...d.chain);d.W.forEach((w,i)=>W[i]=w);Object.assign(S,d.S);price=d.price;ME=d.ME;genBook();return 1}catch(e){return 0}}
function reset(){try{localStorage.removeItem('cc1')}catch(e){}location.reload()}
function doTransfer(){const to=+v('ct'),q=+v('cq');if(q<=0)return msg('revert: amount must be above 0');if(to==ME)return msg('revert: cannot transfer to yourself');if(W[ME].cr<q)return msg('revert: balance too low');W[ME].cr-=q;W[to].cr+=q;tx('TRADE',ME,to,q,{via:'transfer()'});msg('transfer() succeeded');render()}
let SND=true,READY=false;const chain=[],S={ev:[],certs:[],list:[],tam:false,pend:[],manual:false,diff:2,pr:{},nw:[],news:null,ms:0};Object.defineProperty(window,'DIFF',{get:()=>S.diff});
const W=[['Registry (issuer)',0,0],['GreenFarm Co.',3000,0],['Ecotech Ltd',8000,0],['You',5000,20]].map(([n,u,c])=>({n,usd:u,cr:c,addr:'0x'+R()}));
const PROJ=['Reforestation – Kenya','Wind Farm – Gujarat','Biogas – Maharashtra'];
let ME=3,cur='Dashboard',price=[],bids=[],asks=[],timer=null,mu=0.0004,sg=0.02;
function mine(txs){const prev=chain.length?chain[chain.length-1].hash:'0'.repeat(64),b={i:chain.length,t:Date.now(),txs,prev,nonce:0,d:DIFF};const t0=performance.now();let h;do{b.nonce++;h=hash(b.i+b.t+JSON.stringify(txs)+prev+b.nonce)}while(!h.startsWith('0'.repeat(DIFF)));b.hash=h;S.ms=performance.now()-t0;chain.push(b);S.fresh=b.i;if(READY){blip();msg('Block #'+b.i+' mined · nonce '+b.nonce+' · '+S.ms.toFixed(0)+' ms')}return b}
const valid=()=>chain.every((b,i)=>b.hash===hash(b.i+b.t+JSON.stringify(b.txs)+b.prev+b.nonce)&&b.hash.startsWith('0'.repeat(b.d||2))&&(i==0||b.prev===chain[i-1].hash));
function tx(type,from,to,amt,m={}){const t={type,from:W[from].addr,to:W[to].addr,amt,...m},nm={MINT:'CreditMinted',TRADE:'Transfer',RETIRE:'CreditRetired'}[type],ts=new Date().toLocaleTimeString();if(S.manual){S.pend.push(t);S.ev.unshift(`${ts}  ${nm}(${amt} tCO2) queued`);return null}const b=mine([t]);S.ev.unshift(`${ts}  ${nm}(${amt} tCO2) @ block #${b.i}`);return b}
function mineAll(){if(!S.pend.length)return msg('Nothing to mine – the pool is empty');const n=S.pend.length,b=mine(S.pend.splice(0));b.txs.forEach(t=>{if(t.cid){const c=S.certs.find(x=>x.id==t.cid);if(c){c.bi=b.i;c.bh=b.hash}}});S.ev.unshift(`${new Date().toLocaleTimeString()}  Block #${b.i} mined with ${n} tx`);msg(`Mined block #${b.i} with ${n} transactions`);render()}
function msg(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(e.t);e.t=setTimeout(()=>e.style.opacity=0,2400)}
const v=id=>$('#'+id).value,mk=()=>price[price.length-1];
function tick(){const z=Math.sqrt(-2*Math.log(Math.random()||1e-9))*Math.cos(6.283*Math.random());price.push(mk()*Math.exp((mu-0.5*sg*sg)+sg*z));if(Math.random()<.1)shock();genBook();bots();snap();if(['Price Engine','Order Book','Dashboard','Leaderboard'].includes(cur))render()}
function genBook(){const p=mk();bids=[...Array(8)].map((_,i)=>({p:p*(1-.004*(i+1)-Math.random()*.003),q:10+Math.random()*80|0}));asks=[...Array(8)].map((_,i)=>({p:p*(1+.004*(i+1)+Math.random()*.003),q:10+Math.random()*80|0}))}
function init(){let p=18;for(let i=0;i<60;i++){const z=Math.sqrt(-2*Math.log(Math.random()))*Math.cos(6.283*Math.random());p*=Math.exp(mu-0.5*sg*sg+sg*z);price.push(p)}genBook();mine([{type:'GENESIS',note:'CarbonChain simulated ledger'}]);S.pr[PROJ[0]]=S.pr[PROJ[1]]=1;mintC(0,1,500);mintC(1,2,800);S.list.push({s:1,q:50,p:mk()*1.02,pr:PROJ[0]},{s:2,q:120,p:mk()*1.05,pr:PROJ[1]});tx('TRADE',1,3,20,{p:17.9});snap()}
function mintC(pi,o,q){W[o].cr+=q;tx('MINT',0,o,q,{project:PROJ[pi]})}
function doMint(){const q=+v('mq');if(S.pr[PROJ[+v('mp')]]!=1)return msg('Mint blocked: this project needs a passing audit first');if(q<=0)return msg('Enter an amount above 0');mintC(+v('mp'),+v('mo'),q);msg(`Minted ${q} tCO2 credits`);render()}
function doList(){const q=+v('lq'),p=+v('lp');if(q<=0||p<=0)return msg('Enter quantity and price');if(W[ME].cr<q)return msg('Not enough credits in this wallet');W[ME].cr-=q;S.list.push({s:ME,q,p,pr:PROJ[+v('lj')]});msg('Listed for sale');render()}
function buy(i){const l=S.list[i],c=l.q*l.p;if(l.s==ME)return msg('You cannot buy your own listing');if(W[ME].usd<c)return msg('Not enough USD balance');W[ME].usd-=c;W[l.s].usd+=c;W[ME].cr+=l.q;S.list.splice(i,1);tx('TRADE',l.s,ME,l.q,{p:+f2(l.p)});msg('Trade settled on-chain');render()}
function instant(side){const q=+v('iq')||10,b=side?asks[0]:bids[0],c=q*b.p;if(side){if(W[ME].usd<c)return msg('Not enough USD');W[ME].usd-=c;W[ME].cr+=q}else{if(W[ME].cr<q)return msg('Not enough credits');W[ME].cr-=q;W[ME].usd+=c}tx('TRADE',side?0:ME,side?ME:0,q,{p:+f2(b.p)});msg(`${side?'Bought':'Sold'} ${q}t at $${f2(b.p)}`);render()}
function retire(q,why){if(q<=0)return msg('Enter an amount above 0');if(W[ME].cr<q)return msg('Not enough credits to retire');W[ME].cr-=q;const cid='CERT-'+R(8).toUpperCase(),b=tx('RETIRE',ME,ME,q,{reason:why,cid});S.certs.unshift({id:cid,who:W[ME].n,addr:W[ME].addr,q,why,bi:b?b.i:null,bh:b?b.hash:null,t:new Date().toLocaleString()});msg('Credits retired – certificate issued');cur='Retirement';render()}
function theme(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#0f1812';r.dataset.theme=d?'light':'dark'}
function line(a,h=180){const w=600,mn=Math.min(...a),mx=Math.max(...a),pts=a.map((y,i)=>`${i/(a.length-1)*w},${h-8-(y-mn)/(mx-mn||1)*(h-24)}`).join(' ');return`<svg viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2"/><text x="4" y="12" fill="var(--mu)" font-size="11">$${f2(mx)}</text><text x="4" y="${h-1}" fill="var(--mu)" font-size="11">$${f2(mn)}</text></svg>`}
function depth(){const A=asks.concat(S.list.map(l=>({p:l.p,q:l.q}))).sort((a,b)=>a.p-b.p),B=bids.slice().sort((a,b)=>b.p-a.p);let c=0;const bp=B.map(o=>[o.p,c+=o.q]);c=0;const ap=A.map(o=>[o.p,c+=o.q]),lo=bp[bp.length-1][0],hi=ap[ap.length-1][0],mx=Math.max(bp[bp.length-1][1],ap[ap.length-1][1]),X=p=>10+(p-lo)/(hi-lo)*580,Y=q=>200-q/mx*185,path=(a,col)=>`<polyline points="${a.map(([p,q])=>X(p)+','+Y(q)).join(' ')}" fill="none" stroke="${col}" stroke-width="2"/>`;return`<svg viewBox="0 0 600 210">${path(bp,'var(--ac)')}${path(ap,'var(--bad)')}<text x="10" y="208" fill="var(--mu)" font-size="11">$${f2(lo)}</text><text x="560" y="208" fill="var(--mu)" font-size="11">$${f2(hi)}</text></svg>`}
const opt=(a,s)=>a.map((x,i)=>`<option value="${i}" ${i==s?'selected':''}>${x.n||x}</option>`).join('');
const tbl=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const cv=c=>chain[c.bi]&&chain[c.bi].hash==c.bh&&valid();
const sup=t=>chain.flatMap(b=>b.txs).filter(x=>x.type==t).reduce((s,x)=>s+x.amt,0);
const P={
Dashboard:()=>`<div class="g"><div class="card"><div class="mu">Market price</div><div class="big">$${f2(mk())}</div><div class="mu">per tCO2</div></div><div class="card"><div class="mu">Credits minted</div><div class="big">${sup('MINT')}</div></div><div class="card"><div class="mu">Credits retired</div><div class="big">${sup('RETIRE')}</div></div><div class="card"><div class="mu">Chain</div><div class="big">${chain.length} blocks</div><div class="${valid()?'ok':'no'}">${valid()?'Valid':'Tampered – invalid'}</div></div></div><div class="card" style="margin-top:14px"><h3>Price history</h3>${line(price)}</div><div class="card"><h3>Latest activity</h3><pre>${S.ev.slice(0,6).join('\n')}</pre></div>`,
Explorer:()=>`${viz()}<div class="card"><h3>Transaction pool</h3><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${S.manual?'checked':''} onchange="S.manual=this.checked;render()"> Manual mining: queue transactions until I mine a block</label>${S.pend.length?tbl(['Type','From','To','Tonnes'],S.pend.map(t=>[t.type,sh(t.from),sh(t.to),t.amt])):'<p class="mu">The pool is empty.</p>'}<p class="mu">Balances update instantly in this simulation. The pool only controls when transactions are written into a block.</p><button class="b" onclick="mineAll()">Mine block (${S.pend.length} tx)</button></div><div class="card"><div class="row"><span class="${valid()?'ok':'no'}"><b>${valid()?'Chain is valid':'Chain is broken – a block was edited'}</b></span><button class="b alt" onclick="S.tam=!S.tam;if(chain.length>1){const t=chain[1].txs[0];t.amt+=S.tam?5:-5}render()">${S.tam?'Undo tamper':'Tamper with block #1'}</button></div><p class="mu">Each block stores the hash of the one before it. Editing any past block breaks every link after it. Mining requires a hash starting with ${'0'.repeat(DIFF)}.</p></div>${[...chain].reverse().slice(0,12).map(b=>`<div class="card"><b>Block #${b.i}</b> <span class="mu">nonce ${b.nonce} · ${new Date(b.t).toLocaleTimeString()}</span><div class="hs">hash ${b.hash}</div><div class="hs">prev ${b.prev}</div><div class="hs">${JSON.stringify(b.txs).replace(/0x[0-9a-f]{40}/g,sh)}</div></div>`).join('')}`,
Issuance:()=>`<div class="card"><h3>Mint verified credits</h3><div class="row"><label>Project<select id="mp">${opt(PROJ)}</select></label><label>Owner wallet<select id="mo">${opt(W,1)}</select></label><label>Tonnes CO2<input id="mq" type="number" value="100" min="1"></label><button class="b" onclick="doMint()">Mint credits</button></div><p class="mu">One credit equals one tonne of CO2 avoided or removed. Only the registry can sign mint transactions in a real system; here anyone can try it.</p></div><div class="card"><h3>Project audits</h3>${tbl(['Project','Rating · vintage','Status',''],PROJ.map((n,i)=>[n,PQ[n][0]+' · '+PQ[n][1],S.pr[n]==1?'<span class="ok">Verified</span>':S.pr[n]==-1?'<span class="no">Rejected – fraud flagged</span>':'Unaudited',S.pr[n]?'':`<button class="b" onclick="audit(${i})">Audit project</button>`]))}<p class="mu">Credits can only be minted for verified projects. Each audit has about a one in three chance of exposing a fraudulent project.</p></div><div class="card"><h3>Minted so far</h3>${tbl(['Block','Project','Owner','Tonnes'],chain.flatMap(b=>b.txs.filter(x=>x.type=='MINT').map(x=>['#'+b.i,x.project,sh(x.to),x.amt])))}</div>`,
Marketplace:()=>`<div class="card"><h3>Open sell orders</h3>${S.list.length?tbl(['Seller','Project','Rating · vintage','Tonnes','Price','vs fair value',''],S.list.map((l,i)=>[W[l.s].n,l.pr,PQ[l.pr]?PQ[l.pr][0]+' · '+PQ[l.pr][1]:'–',l.q,'$'+f2(l.p),dv(l),`<button class="b" onclick="buy(${i})">Buy lot</button>`])):'<p class="mu">No listings yet. List credits from your wallet below.</p>'}</div><div class="card"><h3>List credits for sale</h3><div class="row"><label>Project<select id="lj">${opt(PROJ)}</select></label><label>Tonnes<input id="lq" type="number" value="5" min="1"></label><label>Price per tonne (USD)<input id="lp" type="number" step="0.1" value="${f2(mk()*1.01)}"></label><button class="b" onclick="doList()">List for sale</button></div><p class="mu">Listed credits are held in escrow until sold. Wallet balance: ${W[ME].cr} tCO2 · $${f2(W[ME].usd)}</p></div>`,
'Order Book':()=>`<div class="card"><h3>Depth chart <span class="mu">(green = bids, red = asks)</span></h3>${depth()}</div><div class="card"><div class="row"><label>Tonnes<input id="iq" type="number" value="10" min="1"></label><button class="b" onclick="instant(1)">Buy at best ask $${f2(asks[0].p)}</button><button class="b alt" onclick="instant(0)">Sell at best bid $${f2(bids[0].p)}</button></div></div><div class="g"><div class="card"><h3>Bids</h3>${tbl(['Price','Tonnes'],bids.map(o=>['$'+f2(o.p),o.q]))}</div><div class="card"><h3>Asks</h3>${tbl(['Price','Tonnes'],asks.map(o=>['$'+f2(o.p),o.q]))}</div></div>`,
Wallets:()=>`<div class="card">${tbl(['Name','Address','Credits (t)','USD'],W.map(w=>[w.n,`<span class="hs">${w.addr}</span>`,w.cr,'$'+f2(w.usd)]))}</div><p class="mu">Addresses are random 20-byte hex strings in Ethereum style. No real keys are involved. Use the selector at the top to act as any wallet.</p>`,
'Smart Contract':()=>`<div class="card"><h3>CarbonCredit.sol <span class="mu">(simulated)</span></h3><pre>contract CarbonCredit {
  mapping(address =&gt; uint) public balance;
  uint public totalMinted; uint public totalRetired;
  event CreditMinted(address to, uint tonnes);
  event Transfer(address from, address to, uint tonnes);
  event CreditRetired(address by, uint tonnes);

  function mint(address to, uint t) onlyRegistry {
    balance[to] += t; totalMinted += t; emit CreditMinted(to, t);
  }
  function transfer(address to, uint t) {
    require(balance[msg.sender] &gt;= t);
    balance[msg.sender] -= t; balance[to] += t;
    emit Transfer(msg.sender, to, t);
  }
  function retire(uint t) {
    require(balance[msg.sender] &gt;= t);
    balance[msg.sender] -= t; totalRetired += t;
    emit CreditRetired(msg.sender, t);
  }
}</pre></div><div class="card"><h3>Call contract functions</h3><div class="row"><label>to<select id="ct">${opt(W,0)}</select></label><label>tonnes<input id="cq" type="number" value="1" min="1"></label><button class="b" onclick="doTransfer()">transfer(to, t)</button><button class="b alt" onclick="retire(+v('cq'),'via retire()')">retire(t)</button></div><p class="mu">Calls run as ${W[ME].n}. A failed require() reverts with an error and changes nothing.</p></div><div class="card"><h3>Event log</h3><pre>${S.ev.join('\n')}</pre></div>`,
Retirement:()=>`<div class="card"><h3>Retire credits permanently</h3><div class="row"><label>Tonnes<input id="rq" type="number" value="5" min="1"></label><label>Reason<input id="rr" value="Company emissions 2026"></label><button class="b" onclick="retire(+v('rq'),v('rr'))">Retire credits</button></div><p class="mu">Retired credits are burned and cannot be traded again. You hold ${W[ME].cr} tCO2.</p></div>${S.certs.length?S.certs.map(c=>`<div class="cert" id="c-${c.id}">${c.bh?pat(c.bh):''}<h3>Certificate of retirement · ${c.id}</h3><div><b>${c.q} tCO2</b> retired by ${c.who}</div><div class="mu">${c.why} · ${c.t}</div><div class="hs">${c.addr}</div><div class="hs">${c.bi==null?'Waiting for a miner':'block #'+c.bi+' · '+c.bh}</div><div class="${c.bi==null?'mu':cv(c)?'ok':'no'}">${c.bi==null?'Pending – mine a block to confirm':cv(c)?'Verified on chain':'Verification failed'}</div><button class="b alt no-print" style="margin-top:8px" onclick="printCert('${c.id}')">Print certificate</button></div>`).join(''):'<p class="mu">No certificates yet. Retire credits to receive one.</p>'}`,
'Price Engine':()=>`<div class="card"><h3>Geometric Brownian Motion</h3>${line(price,220)}<div class="row" style="margin-top:8px"><label>Drift per tick<input id="mu" type="number" step="0.0005" value="${mu}" onchange="mu=+this.value"></label><label>Volatility<input id="sg" type="number" step="0.005" value="${sg}" onchange="sg=+this.value"></label><button class="b" onclick="tick()">Next tick</button><button class="b alt" onclick="shock();genBook();render()">Trigger market event</button><button class="b alt" onclick="auto()">${timer?'Stop auto-run':'Auto-run'}</button></div><p class="mu">Next price = price × exp((μ − σ²/2) + σ·Z), where Z is a standard normal random draw.</p></div>`,
'Offset Calculator':()=>{const k=+(window.fk||0),e=+(window.fe||0),h=+(window.fh||0),t=(k*.192+e*.82+h*90)/1000;return`<div class="card"><h3>New: footprint offset calculator</h3><div class="row"><label>Car km per month<input id="ck" type="number" value="${k||400}"></label><label>Electricity kWh per month<input id="ce" type="number" value="${e||300}"></label><label>Flight hours per year<input id="ch" type="number" value="${h||10}"></label><button class="b" onclick="calc()">Calculate</button></div></div>${window.ft!=null?`<div class="card"><div class="mu">Estimated annual footprint</div><div class="big">${f2(window.ft)} tCO2</div><p>Cost at market price: <b>$${f2(window.ft*mk())}</b>. You hold ${W[ME].cr} credits.</p><button class="b" onclick="retire(Math.ceil(window.ft),'Annual footprint offset')">Offset by retiring ${Math.ceil(window.ft)} credits</button></div>`:''}`}};
const EVT=[['Government announces a national carbon tax',.08],['Wildfire destroys a major forest project',.06],['Big airline buys credits in bulk',.05],['Regulator tightens credit quality standards',-.05],['Fraud scandal hits a credit registry',-.09],['Corporate net-zero pledges surge',.07]];
function shock(){const e=EVT[Math.random()*EVT.length|0];price[price.length-1]*=1+e[1];S.news={t:e[0],j:e[1]};S.ev.unshift(`${new Date().toLocaleTimeString()}  News: ${e[0]}`)}
function bots(){if(Math.random()>.5)return;const a=1+(Math.random()*2|0),b=a==1?2:1,n=price.length,p=mk(),up=n>6?p>price[n-6]:Math.random()<.5,avg=price.slice(-20).reduce((x,y)=>x+y,0)/Math.min(20,n),buy=a==1?up:p<avg,[s,y]=buy?[b,a]:[a,b],q=1+(Math.random()*8|0),pp=p*(1+(Math.random()-.5)*.02);if(W[s].cr<q||W[y].usd<q*pp)return;W[s].cr-=q;W[y].cr+=q;W[s].usd+=q*pp;W[y].usd-=q*pp;tx('TRADE',s,y,q,{p:+f2(pp),bot:1})}
function snap(){S.nw.push(W.map(w=>w.usd+w.cr*mk()));if(S.nw.length>200)S.nw.shift()}
function audit(i){const n=PROJ[i];if(S.pr[n])return;S.pr[n]=Math.random()>.35?1:-1;msg(S.pr[n]>0?'Audit passed – project verified':'Audit failed – project flagged as fraudulent');render()}
function viz(){const fr=S.fresh;S.fresh=null;const fb=chain.findIndex((b,i)=>b.hash!==hash(b.i+b.t+JSON.stringify(b.txs)+b.prev+b.nonce)||(i&&b.prev!==chain[i-1].hash)),csv=chain.flatMap(b=>b.txs.map(t=>[b.i,new Date(b.t).toISOString(),t.type,t.from||'',t.to||'',t.amt||'',t.p||''].join(','))).join('\n');return`<div class="card"><h3>Chain</h3><div class="sc" style="display:flex;align-items:center;gap:4px;padding-bottom:6px">${chain.slice(-14).map(b=>`<div class="${b.i==fr?'pop':''}" style="min-width:76px;border:2px solid ${fb>=0&&b.i>=fb?'var(--bad)':'var(--ac)'};border-radius:6px;padding:4px;font-size:11px;text-align:center"><b>#${b.i}</b><br><span class="hs">${b.hash.slice(0,8)}</span><br>${b.txs.length} tx</div><span class="mu">—</span>`).join('')}</div><div class="row" style="margin-top:8px"><label>Mining difficulty: <span id="dv">${S.diff}</span> leading zeros<input type="range" min="1" max="4" value="${S.diff}" oninput="S.diff=+this.value;$('#dv').textContent=this.value"></label><span class="mu">${S.ms?`Last block: nonce ${chain[chain.length-1].nonce} in ${S.ms.toFixed(0)} ms`:''}</span></div></div><details class="card"><summary>Export ledger as CSV</summary><textarea readonly rows="6" style="width:100%;margin-top:8px" onclick="this.select()">${csv}</textarea></details>${merk()}`}
P.Leaderboard=()=>{const r=W.map((w,i)=>({i,n:w.n,cr:w.cr,usd:w.usd,nw:w.usd+w.cr*mk()})).sort((a,b)=>b.nw-a.nw);return`<div class="card"><h3>Net worth ranking</h3>${tbl(['Rank','Wallet','Credits','USD','Net worth'],r.map((x,k)=>[k+1,x.n+(x.i==ME?' (you)':''),x.cr,'$'+f2(x.usd),'<b>$'+f2(x.nw)+'</b>']))}<p class="mu">Net worth = USD + credits × market price. Start Auto-run in the Price Engine and the two company wallets begin trading: GreenFarm follows the trend, Ecotech buys dips and sells rallies.</p></div><div class="card"><h3>${W[ME].n}: net worth over time</h3>${S.nw.length>1?line(S.nw.map(x=>x[ME])):'<p class="mu">Run a few price ticks to build history.</p>'}</div>`};
P.Impact=()=>{const all=sup('RETIRE'),own=chain.flatMap(b=>b.txs).filter(x=>x.type=='RETIRE'&&x.from==W[ME].addr).reduce((s,x)=>s+x.amt,0),row=t=>`<div class="g"><div class="card"><div class="big">${Math.round(t*45)}</div><div class="mu">trees growing for a year</div></div><div class="card"><div class="big">${Math.round(t*1000/.192)}</div><div class="mu">car km avoided</div></div><div class="card"><div class="big">${f2(t/.09)}</div><div class="mu">flight hours avoided</div></div></div>`;return`<div class="card"><h3>Retired by ${W[ME].n}: ${own} tCO2</h3></div>${row(own)}<div class="card" style="margin-top:14px"><h3>Retired by everyone: ${all} tCO2</h3></div>${row(all)}<p class="mu">Rough equivalents: 1 tonne ≈ 45 tree-years, 5,208 car km at 0.192 kg/km, and 11 flight hours at 90 kg/hour.</p>`};
const PQ={'Reforestation – Kenya':['AA',2024,1.10],'Wind Farm – Gujarat':['A',2025,1],'Biogas – Maharashtra':['B',2023,.9]};
const dv=l=>{const d=(l.p/(mk()*(PQ[l.pr]?PQ[l.pr][2]:1))-1)*100;return`<span class="${d>0?'no':'ok'}">${d>0?'+':''}${d.toFixed(1)}%</span>`};
const pat=h=>`<svg viewBox="0 0 8 8" style="width:64px;float:right;color:var(--tx)">${[...Array(64)].map((_,i)=>parseInt(h[2+i%60]||'0',16)%2?`<rect x="${i%8}" y="${i>>3}" width="1" height="1" fill="currentColor"/>`:'').join('')}</svg>`;
function printCert(id){const e=document.getElementById('c-'+id);e.classList.add('pp');try{window.print()}catch(x){msg('Printing is blocked in this view')}e.classList.remove('pp')}
function merk(){const rc=chain.slice(-14),b=rc.reduce((m,x)=>x.txs.length>=m.txs.length?x:m,rc[0]);let L=[b.txs.map(t=>hash(JSON.stringify(t)))];while(L[0].length>1){const q=L[0],n=[];for(let i=0;i<q.length;i+=2)n.push(hash(q[i]+(q[i+1]||q[i])));L.unshift(n)}return`<details class="card"><summary>Merkle tree of block #${b.i} (${b.txs.length} tx)</summary><pre style="margin-top:8px">${L.map((r,k)=>(k?'      ':'root  ')+r.map(h=>h.slice(0,8)).join('  ')).join('\n')}</pre><p class="mu">Each parent is the hash of its two children, so the single root commits to every transaction below it. Manually mined blocks with several transactions make taller trees.</p></details>`}
const cp=i=>(S.cp=S.cp||{})[i]||(S.cp[i]={cap:[0,60,90,40][i],em:0});
function quarter(){S.q=(S.q||0)+1;for(let i=1;i<4;i++)cp(i).em+=10+Math.random()*20|0;S.ev.unshift(`${new Date().toLocaleTimeString()}  Quarter ${S.q} emissions reported`);render()}
function settle(){S.cl=[];for(let i=1;i<4;i++){const c=cp(i),over=Math.max(0,c.em-c.cap),use=Math.min(over,Math.floor(W[i].cr)),pen=Math.min(W[i].usd,(over-use)*50);if(use>0){W[i].cr-=use;tx('RETIRE',i,i,use,{reason:'Compliance surrender'})}W[i].usd-=pen;S.cl.push(`${W[i].n}: ${c.em}t emitted vs cap ${c.cap}t, surrendered ${use}t, fined $${f2(pen)}`);c.em=0}S.q=0;render()}
P.Compliance=()=>`<div class="card"><h3>Cap-and-trade compliance year</h3><p class="mu">Each company has an annual emissions cap. Anything over the cap must be covered by surrendering (retiring) credits, or it costs $50 per tonne in fines. Run four quarters, then settle. Buy credits on the marketplace to stay compliant.</p><div class="row"><button class="b" onclick="quarter()">Run a quarter (${S.q||0}/4)</button><button class="b alt" onclick="settle()">Settle compliance year</button></div></div><div class="card">${tbl(['Company','Cap (t)','Emitted (t)','Over cap (t)','Credits held'],[1,2,3].map(i=>{const c=cp(i);return[W[i].n+(i==ME?' (you)':''),c.cap,c.em,`<span class="${c.em>c.cap?'no':'ok'}">${Math.max(0,c.em-c.cap)}</span>`,W[i].cr]}))}</div>${S.cl&&S.cl.length?`<div class="card"><h3>Last settlement</h3><pre>${S.cl.join('\n')}</pre></div>`:''}`;
function blip(){if(!SND)return;try{const c=blip.c||(blip.c=new(window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=660;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.2);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.22)}catch(e){}}
const TOUR=[['Dashboard','Welcome to CarbonChain','A simulated carbon credit market running on its own blockchain. These cards show the market price, credits minted and retired, and whether the chain is still valid.'],['Issuance','1. Audit and mint','Credits are created here. A project must pass an audit before you can mint credits for it.'],['Marketplace','2. Trade','Buy lots from other wallets or list your own. "vs fair value" compares each price with the project quality.'],['Explorer','3. Watch the chain','Every action becomes a block. Try the Tamper button to break the hash links, or turn on manual mining to batch transactions.'],['Retirement','4. Retire credits','Retiring burns credits for good and gives you a certificate you can print and verify.'],['Price Engine','5. Make it move','Start Auto-run so prices change, news hits and the bots start trading.'],['Compliance','6. Cap-and-trade','Run quarters, then settle the year to see companies surrender credits or pay fines.']];
function tour(i){if(i===undefined){try{if(localStorage.getItem('cc_tour'))return}catch(e){}i=0}if(i>=TOUR.length){$('#tour').innerHTML='';try{localStorage.setItem('cc_tour','1')}catch(e){}return}const t=TOUR[i];cur=t[0];render();$('#tour').innerHTML=`<div class="dlg"><b>${t[1]}</b><p>${t[2]}</p><div class="row"><button class="b alt" onclick="tour(${i-1})" ${i?'':'disabled'}>Back</button><button class="b" onclick="tour(${i+1})">${i==TOUR.length-1?'Finish':'Next'} (${i+1}/${TOUR.length})</button><button class="b alt" onclick="tour(99)">Skip</button></div></div>`}
function closeDlg(){$('#dlg').innerHTML=''}
function openIO(){$('#dlg').innerHTML='<div class="dlg"><b>Save / Load ledger</b><p class="mu">Copy this text to back up the whole chain, wallets and prices. Paste a saved copy here and press Load to restore it.</p><textarea id="iot" rows="8"></textarea><div class="row" style="margin-top:8px"><button class="b" onclick="ioCopy()">Copy</button><button class="b alt" onclick="ioLoad()">Load pasted data</button><button class="b alt" onclick="closeDlg()">Close</button></div></div>';$('#iot').value=JSON.stringify({chain,W,S,price,ME})}
function ioCopy(){const t=$('#iot');t.select();try{navigator.clipboard.writeText(t.value).then(()=>msg('Copied to clipboard'),()=>msg('Press Ctrl+C to copy'))}catch(e){msg('Press Ctrl+C to copy')}}
function ioLoad(){try{const d=JSON.parse($('#iot').value);if(!Array.isArray(d.chain)||!d.chain.length||!Array.isArray(d.W)||d.W.length!=4||!Array.isArray(d.price))throw 0;chain.length=0;chain.push(...d.chain);d.W.forEach((w,i)=>W[i]=w);Object.assign(S,d.S);price=d.price;ME=d.ME||0;genBook();closeDlg();render();msg(`Loaded ${chain.length} blocks · chain ${valid()?'valid':'INVALID'}`)}catch(e){msg('That does not look like a CarbonChain ledger')}}
function calc(){const k=+v('ck'),e=+v('ce'),h=+v('ch');window.fk=k;window.fe=e;window.fh=h;window.ft=(k*12*.192+e*12*.82+h*90)/1000;render()}
function auto(){if(timer){clearInterval(timer);timer=null}else timer=setInterval(tick,1200);render()}
function render(){save();$('#news').innerHTML=S.news?`<div class="card" style="border-color:var(--ac2)"><b>Market news:</b> ${S.news.t} (${S.news.j>0?'+':''}${(S.news.j*100).toFixed(0)}% price move)</div>`:'';$('#ttl').textContent=cur;$('#nav').innerHTML='<h1>CarbonChain</h1>'+Object.keys(P).map(n=>`<button class="${n==cur?'on':''}" onclick="cur='${n}';render()">${n}</button>`).join('');$('#me').innerHTML=opt(W,ME);const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&a.id!='me'&&cur!='Price Engine'&&cur!='Order Book')return $('#main').innerHTML=P[cur](),0;$('#main').innerHTML=P[cur]()}
load()||init();render();READY=true;tour();
</script></body></html>
